<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚂</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e9ebef" />
    <meta name="description" content="सफ़र-ए-रेल — infinite AC 2-Tier journey through green India with non-stop 90s Bollywood" />
    <title>सफ़र-ए-रेल · Safar-e-Rail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&family=Tiro+Devanagari+Hindi:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!--
      Structure:
      - White coach panels OUTSIDE the window only (4 solid strips)
      - One black frame box
      - Video fills 100% of the frame interior (no gaps, no radius on video)
      - Curtains flush to glass edges, full height, square corners
    -->
    <div id="window-stack" aria-hidden="true">
      <!-- Solid white coach — 4 panels, never inside the glass -->
      <div class="coach-panel coach-top"></div>
      <div class="coach-panel coach-bottom"></div>
      <div class="coach-panel coach-left"></div>
      <div class="coach-panel coach-right"></div>

      <!-- The window unit: black border + full-bleed glass -->
      <div class="window-unit">
        <div id="world-clip">
          <canvas id="world" aria-hidden="true"></canvas>
        </div>
        <div class="glass-tint"></div>
        <div class="glass-reflection"></div>
        <div class="curtain curtain-left"></div>
        <div class="curtain curtain-right"></div>
      </div>
    </div>

    <div id="chrome" class="dimmed">
      <div class="control-cell">
        <div class="now-playing">
          <span class="np-live" aria-hidden="true"></span>
          <div class="station-dd" id="station-dd">
            <button type="button" class="station-dd-trigger" id="station-dd-trigger" aria-haspopup="listbox" aria-expanded="false" aria-label="Choose radio station">
              <span class="station-dd-meta">
                <span class="station-dd-kicker">Station</span>
                <span class="station-dd-label" id="station-dd-label">—</span>
              </span>
              <span class="station-dd-chevron" aria-hidden="true"></span>
            </button>
            <ul class="station-dd-menu" id="station-dd-menu" role="listbox" hidden></ul>
          </div>
        </div>
        <div class="control-divider" aria-hidden="true"></div>
        <div class="chrome-controls">
          <div class="vol-wrap" title="Volume">
            <button type="button" id="btn-mute" class="icon-btn" aria-label="Mute" title="Mute">
              <!-- Single speaker icon only -->
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"/>
                <path d="M16 9.5a3.5 3.5 0 010 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
            </button>
            <input type="range" id="vol-slider" min="0" max="100" value="85" aria-label="Volume" />
          </div>
          <button type="button" id="btn-fs" class="icon-btn" aria-label="Fullscreen" title="Fullscreen">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button type="button" id="btn-about" class="icon-btn" aria-label="About" title="About">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
              <path d="M12 10v6M12 7.5v.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
          <button type="button" id="btn-back" class="icon-btn" aria-label="Back to train select" title="Back">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
      <div id="journey-label" class="journey-pill"></div>
    </div>

    <div id="about-card">
      <button type="button" id="close-about" aria-label="Close">×</button>
      <h2 lang="hi">सफ़र-ए-रेल</h2>
      <p class="about-en-title">Safar-e-Rail</p>
      <p class="en">An endless AC 2-Tier window seat through green India.</p>
      <p class="hi-line" lang="hi">कोच A1 · बर्थ 25 · साइड लोअर</p>
      <p>Radio: <span id="about-station">—</span></p>
    </div>

    <div id="toast" role="status"></div>

    <div id="boarding">
      <div class="hero-photo" role="img" aria-label="Train through forest from above"></div>
      <div class="hero-grade"></div>
      <div class="hero-scrim"></div>
      <div class="hero-vignette"></div>
      <div class="hero-grain"></div>

      <div class="boarding-center">
        <p class="eyebrow">INDIAN RAILWAYS · AC 2-TIER</p>
        <h1 class="hero-title" lang="hi">सफ़र-ए-रेल</h1>
        <p class="hero-sub">Safar-e-Rail</p>
        <p class="hero-tag">Window seat · forever · 90s Bollywood</p>

        <div class="train-dd" id="train-dd">
          <button type="button" class="train-dd-trigger" id="train-dd-trigger" aria-haspopup="listbox" aria-expanded="false">
            <span class="train-dd-label" id="train-dd-label">Select train</span>
            <span class="train-dd-chevron" aria-hidden="true"></span>
          </button>
          <ul class="train-dd-menu" id="train-dd-menu" role="listbox" hidden></ul>
          <select id="train-select" class="sr-only" aria-hidden="true" tabindex="-1">
            <option value="" disabled selected>Select train</option>
          </select>
        </div>

        <div id="after-select" class="after-select hidden">
          <p id="route-line" class="route-line"></p>
          <p id="board-status" class="board-status-lite">Loading…</p>
          <button type="button" id="board-btn" class="board-btn-lite" disabled>Board</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
